services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: cnk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: cnk-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build:
      context: .
      dockerfile: product-service/Containerfile
    container_name: cnk-product-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: productdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Containerfile
    container_name: cnk-inventory-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: inventorydb
      DB_USER: postgres
      DB_PASSWORD: postgres
      PRODUCT_SERVICE_URL: http://product-service:8081
    ports:
      - "18082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: order-service/Containerfile
    container_name: cnk-order-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: orderdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      PRODUCT_SERVICE_URL: http://product-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    ports:
      - "18083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started

volumes:
  postgres-data:
